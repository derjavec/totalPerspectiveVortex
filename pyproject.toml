[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "total-perspective-vortex"
version = "0.1.0"
description = "EEG processing with MNE"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
  "mne>=1.6",
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8"
]

[project.scripts]
tpv = "total_perspective_vortex.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
